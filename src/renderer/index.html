<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' tsicon: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>时间统计</title>
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body data-view="library">
  <header class="titlebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="#1b2838" />
        <circle cx="16" cy="16" r="9.2" fill="none" stroke="#66c0f4" stroke-width="2.4" />
        <path d="M16 16 V9.6" stroke="#c7d5e0" stroke-width="2.2" stroke-linecap="round" />
        <path d="M16 16 L21.2 19.4" stroke="#c7d5e0" stroke-width="2.2" stroke-linecap="round" />
        <circle cx="16" cy="16" r="1.7" fill="#66c0f4" />
      </svg>
      <span class="brand-name">时间统计</span>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="library">库</button>
      <button class="tab" data-view="stats">统计</button>
      <button class="tab" data-view="settings">设置</button>
    </nav>

    <div class="titlebar-right">
      <div class="search" id="search-wrap">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 10.6 L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="搜索软件" autocomplete="off" spellcheck="false" />
      </div>
      <button class="btn primary" id="btn-add"><span class="plus">＋</span>新建</button>
    </div>
  </header>

  <main class="content" id="content">
    <section class="view active" id="view-library">
      <div class="toolbar">
        <div class="lib-title">
          <h2>我的库</h2>
          <span class="muted" id="lib-count"></span>
        </div>
        <div class="toolbar-right">
          <label class="select-wrap">
            <span>排序</span>
            <select id="sort-select">
              <option value="lastUsed">最近使用</option>
              <option value="total">总时长</option>
              <option value="name">名称</option>
              <option value="created">添加时间</option>
            </select>
          </label>
        </div>
      </div>

      <div class="grid" id="grid"></div>

      <div class="empty" id="lib-empty" hidden>
        <div class="empty-art">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect x="6" y="8" width="52" height="40" rx="6" fill="none" stroke="#2f4759" stroke-width="2.5"/>
            <path d="M6 38 L20 28 L32 36 L44 24 L58 34" stroke="#2f4759" stroke-width="2.5" fill="none"/>
            <circle cx="32" cy="54" r="6" fill="none" stroke="#3d5d75" stroke-width="2.5"/>
          </svg>
        </div>
        <h3>还没有添加任何软件</h3>
        <p>点右上角「＋ 新建」，从电脑里挑一个 .exe 程序。<br />以后每次从这里启动它，都会自动记录用了多久。</p>
        <button class="btn primary" id="btn-add-empty"><span class="plus">＋</span>新建</button>
      </div>
    </section>

    <section class="view" id="view-detail">
      <div id="detail-body"></div>
    </section>

    <section class="view" id="view-stats">
      <div id="stats-body"></div>
    </section>

    <section class="view" id="view-settings">
      <div id="settings-body"></div>
    </section>
  </main>

  <div class="toast-wrap" id="toasts"></div>
  <div class="ctx-menu" id="ctxmenu" hidden></div>
  <div class="modal-wrap" id="modal" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/library.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
